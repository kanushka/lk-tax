name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Text sidecars are current
        run: python3 scripts/extract_text.py --check

      - name: Index and metadata are current
        run: python3 scripts/build_index.py --check
